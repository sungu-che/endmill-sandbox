[package]
name = "endmill_sandbox"
version = "0.2.0"
edition = "2021"
description = "End Mill specification, coating, and cutting condition data model"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
base64 = "0.22"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
lancedb = { version = "0.39", features = ["remote"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[lib]
name = "endmill_model"
path = "src/lib.rs"

[[bin]]
name = "endmill_demo"
path = "src/bin/main.rs"
