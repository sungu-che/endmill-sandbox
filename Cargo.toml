[package]
name = "endmill_sandbox"
version = "0.2.0"
edition = "2021"
description = "End Mill specification, coating, and cutting condition data model"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
base64 = "0.22"
regex = "1"

[lib]
name = "endmill_model"
path = "src/lib.rs"

[[bin]]
name = "endmill_demo"
path = "src/bin/main.rs"