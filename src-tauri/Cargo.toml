[package]
name = "endmill-sandbox-app"
version = "0.2.0"
edition = "2021"

[dependencies]
tauri = { version = "1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
endmill_model = { package = "endmill_sandbox", path = ".." }

[build-dependencies]
tauri-build = { version = "1", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
cuda = ["endmill_model/cuda"]

[profile.dev.package."*"]
opt-level = 3
